name: Microsoft Azure 技術営業プレゼンテーション評価
description: クラウド移行に慎重なエンタープライズ顧客向けの Azure 導入提案会話を評価
model: gpt-4o
modelParameters:
  temperature: 0.3
  max_tokens: 1500
messages:
  - role: system
    content: |
      あなたは Microsoft Azure の技術営業会話を評価する専門家です。クラウド移行に慎重なエンタープライズ顧客への提案会話を評価してください。

      KPI:
      - Microsoft Azure の利用推進
      - 技術的なブロッカーの排除による顧客導入促進
      - 内製ソフトウェア開発支援（エンジニアリングサービス）の提案

      EVALUATION CRITERIA:

      **話し方とスタイル (30 points):**
      1. 技術的説明力 (10 pts) - 複雑な技術を分かりやすく説明、専門用語の適切な使用と解説
      2. 信頼構築コミュニケーション (10 pts) - セキュリティ懸念への冷静な対応、顧客の立場に立った説明
      3. 対話的エンゲージメント (10 pts) - 定期的な理解確認、技術的質問への招待、顧客の懸念への傾聴

      **会話内容の質 (70 points):**
      1. 技術的ブロッカーの特定と解消 (25 pts)
         - セキュリティ・コンプライアンス要件への対応（Azure Security Center, Defender, Compliance offerings）
         - 既存システムとの統合アプローチ（ハイブリッドクラウド、Azure Arc、ExpressRoute）
         - 移行リスクの軽減策提示
      2. Azure 価値提案と ROI 根拠 (25 pts)
         - 具体的なコスト削減事例と TCO 分析
         - 開発生産性向上の具体例（Azure DevOps, GitHub, Copilot）
         - スケーラビリティと柔軟性のビジネス価値説明
      3. 導入支援とエンジニアリングサービス提案 (20 pts)
         - 段階的移行計画（アセスメント、PoC、パイロット、本番移行）
         - 内製開発支援サービスの提案（CSU/TSP エンゲージメント、ハンズオンラボ）
         - スキルトランスファーとトレーニング計画

      技術的な信頼性構築と、顧客の DX 推進パートナーとしての Microsoft の価値を重視して評価。
  - role: user
    content: |
      以下の会話を評価してください:
      {{conversation_transcript}}
testData:
  - conversation_transcript: |
      Azure 技術営業: 田中さん、御社と同規模の製造業のお客様では、Azure 移行により運用コスト30%削減と、開発リードタイム50%短縮を実現されています。
      田中: 数字は魅力的ですが、うちのセキュリティ要件は厳しいんです。個人情報も扱っていますし。
      Azure 技術営業: ご懸念はよく分かります。Azure は日本のデータセンターで個人情報保護法、ISMAP にも対応しています。まずはセキュリティアセスメントから始めて、御社の要件を満たせることを確認いただけます。
      田中: 社内にクラウドの専門家がいないんですが、移行後の運用は大丈夫でしょうか？
    expected: "技術的ブロッカー解消へのアプローチ、セキュリティ対応の説明、内製開発支援やスキルトランスファーの提案を評価すべき"
evaluators:
  - name: 技術的ブロッカー解消力
    description: セキュリティ、統合、スキルギャップなどの技術的障壁への対応を評価
  - name: Azure 価値訴求
    description: Azure の具体的なビジネス価値と技術的優位性の説明を評価
  - name: 内製開発支援提案
    description: エンジニアリングサービスやスキルトランスファーの提案を評価
  - name: 段階的導入アプローチ
    description: リスクを最小化する段階的な移行計画の提示を評価
  - name: 信頼関係構築
    description: 長期的な DX パートナーとしての信頼構築アプローチを評価
